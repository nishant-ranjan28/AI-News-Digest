services:
  - type: web
    name: ai-news-digest
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PORT
        value: 3000

  # Vercel Cron (vercel.json) does NOT run on Render. These cron jobs keep the
  # daily digest firing when deployed to Render.
  - type: cron
    name: ai-news-digest-cron
    runtime: node
    schedule: "30 0 * * *"
    buildCommand: npm install
    startCommand: node -e "fetch(process.env.APP_URL + '/api/cron', { headers: { Authorization: 'Bearer ' + process.env.CRON_SECRET } }).then(r=>r.text().then(t=>console.log(t))).catch(e=>{console.error(e);process.exit(1)})"
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
  - type: cron
    name: ai-news-digest-cron-repurpose
    runtime: node
    schedule: "45 0 * * *"
    buildCommand: npm install
    startCommand: node -e "fetch(process.env.APP_URL + '/api/cron-repurpose', { headers: { Authorization: 'Bearer ' + process.env.CRON_SECRET } }).then(r=>r.text().then(t=>console.log(t))).catch(e=>{console.error(e);process.exit(1)})"
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
